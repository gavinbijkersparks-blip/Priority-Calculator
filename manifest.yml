modules:
  jira:issueContext:
    - key: prio-dash-ctx
      title: Priority Dashboard
      label: Priority Dashboard
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: prio-issue-panel
      resolver:
        function: prio-dash-resolver
      displayConditions:
        entityPropertyEqualTo:
          entity: issueType
          propertyKey: priority-dashboard
          objectName: enabled
          value: "true"

  jira:adminPage:
    - key: prio-dash-admin
      title: Priority Dashboard Configuration
      resource: prio-admin-page
      resolver:
        function: prio-dash-resolver

  function:
    - key: prio-dash-resolver
      handler: index.handler

resources:
  - key: prio-issue-panel
    path: static/issue-panel/dist
  - key: prio-log-modal
    path: static/issue-log-modal/dist
  - key: prio-admin-page
    path: static/admin/dist

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - write:jira-work
    - manage:jira-configuration
    - storage:app

app:
  id: ari:cloud:ecosystem::app/95921ecb-4006-4512-8026-7ce5adbdcafc
  runtime:
    name: nodejs20.x
