modules:
  jira:issueContext:
    - key: risk-score-calculator-context
      title: Risk Calculator
      label: Risk Calculator
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: risk-score-issue-panel
      resolver:
        function: risk-score-resolver
      displayConditions:
        entityPropertyEqualTo:
          entity: issueType
          propertyKey: risk-score-calculator
          objectName: enabled
          value: "true"

  jira:adminPage:
    - key: risk-score-admin-page
      title: Risk Calculator Configuration
      resource: risk-score-admin-page
      resolver:
        function: risk-score-resolver

  function:
    - key: risk-score-resolver
      handler: index.handler

resources:
  - key: risk-score-issue-panel
    path: static/issue-panel/dist
  - key: risk-log-modal
    path: static/issue-log-modal/dist
  - key: risk-score-admin-page
    path: static/admin/dist

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - write:jira-work
    - manage:jira-configuration
    - storage:app

app:
  id: ari:cloud:ecosystem::app/2920ca05-80a1-4c77-ace4-19174c391284
  runtime:
    name: nodejs20.x
